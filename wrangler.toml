name = "mytourguide-web"
compatibility_date = "2026-07-23"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "ADMIN_CONFIG_DB"
database_name = "mytourguide-admin-config"
database_id = "eb9ef100-9d1f-4c1b-b44f-d1187968a3e6"
migrations_dir = "migrations"

[vars]
ADMIN_USERNAME = "admin"
# iyzico sanal POS ayarları:
# - IYZICO_BASE_URL burada tanımlanabilir (secret değil): test için
#   "https://sandbox-api.iyzipay.com", canlı için "https://api.iyzipay.com".
#   Tanımlanmazsa sandbox varsayılır.
# - IYZICO_API_KEY ve IYZICO_SECRET_KEY BURAYA YAZILMAZ (bu dosya git'e gider).
#   Bunun yerine terminalden secret olarak eklenir:
#     wrangler pages secret put IYZICO_API_KEY
#     wrangler pages secret put IYZICO_SECRET_KEY
IYZICO_BASE_URL = "https://sandbox-api.iyzipay.com"
